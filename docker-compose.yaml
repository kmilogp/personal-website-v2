services:
  db:
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal-website
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    image: oven/bun:1
    ports:
      - 3000:3000
    working_dir: /app
    volumes:
      - .:/app
    env_file:
        - .env.dev
    entrypoint: ["bun", "run", "dev"]
    depends_on:
      - db

volumes:
  postgres_data:
